  function generateProposalPDF(p, prospect) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.getWidth();
    const COMPANY_ADDRESS_1 = "Rua Ribeiro de Lima, 282 - 6º andar - Sala 602 - Bairro: Bom Retiro";
    const COMPANY_ADDRESS_2 = "CEP: 01122-000  ·  Tel.: (11) 99246-0999  ·  São Paulo - SP";

    function sectionBand(txt, y) {
      doc.setFillColor(124, 92, 255);
      doc.rect(14, y, pageWidth - 28, 7, "F");
      doc.setFontSize(9);
      doc.setTextColor(255, 255, 255);
      doc.text(txt, 17, y + 5);
      doc.setTextColor(30);
      return y + 12;
    }

    const logoW = 48, logoH = 14.1;
    try { doc.addImage(LOGO_DATA_URI, "PNG", (pageWidth - logoW) / 2, 10, logoW, logoH); } catch (e) {}
    let hy = 10 + logoH + 5;
    doc.setFontSize(8.5);
    doc.setTextColor(90);
    doc.text(COMPANY_ADDRESS_1, pageWidth / 2, hy, { align: "center" }); hy += 4;
    doc.text(COMPANY_ADDRESS_2, pageWidth / 2, hy, { align: "center" }); hy += 5;
    doc.setDrawColor(124, 92, 255);
    doc.setLineWidth(0.8);
    doc.line(14, hy, pageWidth - 14, hy);
    hy += 8;

    doc.setFontSize(14);
    doc.setTextColor(30);
    doc.setFont(undefined, "bold");
    doc.text("PROPOSTA COMERCIAL", pageWidth / 2, hy, { align: "center" });
    doc.setFont(undefined, "normal");
    hy += 6;
    doc.setFontSize(9);
    doc.setTextColor(100);
    doc.text(`Nº ${p.number}`, pageWidth / 2, hy, { align: "center" });
    hy += 10;

    doc.setFillColor(245, 245, 250);
    const clientBoxLines = 2 + (prospect && addressLine(prospect) ? 1 : 0) + (prospect?.cnpj ? 1 : 0) + ([prospect?.phone, prospect?.email].filter(Boolean).length ? 1 : 0);
    const clientBoxH = clientBoxLines * 5 + 6;
    doc.roundedRect(14, hy, pageWidth - 28, clientBoxH, 2, 2, "F");
    let cy = hy + 7;
    doc.setFontSize(11);
    doc.setTextColor(30);
    doc.setFont(undefined, "bold");
    doc.text(prospect?.name || "", 18, cy);
    doc.setFont(undefined, "normal");
    cy += 6;
    doc.setFontSize(9);
    doc.setTextColor(90);
    if (prospect && addressLine(prospect)) { doc.text(addressLine(prospect), 18, cy); cy += 5; }
    if (prospect?.cnpj) { doc.text(`CNPJ: ${prospect.cnpj}`, 18, cy); cy += 5; }
    const contact = [prospect?.phone, prospect?.email].filter(Boolean).join("  ·  ");
    if (contact) { doc.text(contact, 18, cy); cy += 5; }
    hy += clientBoxH + 8;

    let y = hy;
    doc.setFontSize(9);
    doc.setTextColor(40);
    const lines = doc.splitTextToSize(p.body_text || "", 180);
    lines.forEach((line) => {
      if (y > 270) { doc.addPage(); y = 20; }
      doc.text(line, 14, y);
      y += 5;
    });

    if (y > 225) { doc.addPage(); y = 20; }
    y += 4;
    y = sectionBand("INVESTIMENTO", y);

    // Monta a tabela: Módulos | Qtd | Valor Implantação (único) | Valor Mensalidade
    // Coluna Mensalidade: Loja + Fábrica + Produção + mensalidade da integração. Coluna Implantação: implantação, treinamento, customização, cloud, setup da integração.
    const items = p.monthly_items || [];
    const rows = [];
    items.filter((it) => (it.desc || "").startsWith("Loja")).forEach((it) => rows.push([it.desc, "1", "--", fmtMoney(it.value)]));
    const fabricaItem = items.find((it) => it.desc === "Fábrica");
    if (fabricaItem) rows.push(["Fábrica", "1", "--", fmtMoney(fabricaItem.value)]);
    const producaoItem = items.find((it) => it.desc === "Produção");
    if (producaoItem) rows.push(["Produção", "1", "--", fmtMoney(producaoItem.value)]);
    if (p.integration_monthly_value > 0) rows.push([`Mensalidade integração${p.integration_platforms ? " (" + p.integration_platforms + ")" : ""}`, "1", "--", fmtMoney(p.integration_monthly_value)]);

    const installBundle = (p.installation_value || 0) + (p.training_value || 0) + (p.db_transfer_value || 0);
    if (installBundle > 0) rows.push(["Implantação (inclui treinamento e transferência de banco de dados, quando houver)", "1", fmtMoney(installBundle), "--"]);
    const cloudItem = items.find((it) => it.desc === "Cloud");
    if (cloudItem) rows.push([`Cloud${p.cloud_description ? " - " + p.cloud_description : ""}`, "1", fmtMoney(cloudItem.value), "--"]);
    if (p.integration_setup_value > 0) rows.push([`Integração com e-commerce${p.integration_platforms ? " (" + p.integration_platforms + ")" : ""}`, "1", fmtMoney(p.integration_setup_value), "--"]);
    items.filter((it) => !(it.desc || "").startsWith("Loja") && !["Produção", "Fábrica", "Cloud"].includes(it.desc) && !(it.desc || "").startsWith("Integração")).forEach((it) => rows.push([it.desc, "1", fmtMoney(it.value), "--"]));

    const customTotalPdf = items.filter((it) => !(it.desc || "").startsWith("Loja") && !["Produção", "Fábrica", "Cloud"].includes(it.desc) && !(it.desc || "").startsWith("Integração")).reduce((s, it) => s + (Number(it.value) || 0), 0);
    const implantacaoTotalPdf = installBundle + (cloudItem?.value || 0) + (p.integration_setup_value || 0) + customTotalPdf;

    doc.autoTable({
      startY: y,
      head: [["Módulos / Serviços", "Qtd.", "Valor Implantação", "Valor Mensalidade"]],
      body: rows,
      foot: [["TOTAL COM DESCONTO", "", fmtMoney(implantacaoTotalPdf), fmtMoney(p.monthly_value)]],
      styles: { fontSize: 8.5 },
      headStyles: { fillColor: [124, 92, 255] },
      footStyles: { fillColor: [230, 230, 240], textColor: 20, fontStyle: "bold" },
      margin: { left: 14, right: 14 },
    });

    y = doc.lastAutoTable.finalY + 8;
    if (y > 240) { doc.addPage(); y = 20; }
    doc.setFillColor(245, 245, 250);
    const summaryLines = 2 + 1 + (p.pix_key ? 1 : 0) + 1;
    const summaryH = summaryLines * 6 + 6;
    doc.roundedRect(14, y, pageWidth - 28, summaryH, 2, 2, "F");
    let sy = y + 8;
    doc.setFontSize(10);
    doc.setTextColor(30);
    doc.setFont(undefined, "bold");
    doc.text(`Valor total da mensalidade: ${fmtMoney(p.monthly_value)}`, 18, sy); sy += 6;
    doc.text(`Valor total da implantação: ${fmtMoney(implantacaoTotalPdf)}`, 18, sy); sy += 7;
    doc.setFont(undefined, "normal");
    doc.setFontSize(9);
    doc.setTextColor(60);
    doc.text(`Forma de pagamento: ${p.payment_method || "-"}`, 18, sy); sy += 6;
    if (p.pix_key) { doc.text(`Chave PIX: ${p.pix_key}${p.pix_favorecido ? "  —  Favorecido: " + p.pix_favorecido : ""}`, 18, sy); sy += 6; }
    doc.text(`Validade da proposta: ${p.valid_until ? new Date(p.valid_until + "T00:00:00").toLocaleDateString("pt-BR") : "-"}`, 18, sy);
    y += summaryH + 6;

    if (p.pix_key) {
      const qrPayload = generatePixPayload({ key: p.pix_key, name: p.pix_favorecido, city: "SAO PAULO", value: null, txid: p.number });
      const qrData = generatePixQRDataURL(qrPayload, 200);
      if (qrData) {
        if (y > 230) { doc.addPage(); y = 20; }
        try { doc.addImage(qrData, "PNG", 14, y, 30, 30); } catch (e) {}
        doc.setFontSize(8);
        doc.setTextColor(90);
        doc.text("Aponte a câmera do seu banco pra pagar via PIX", 48, y + 16);
        y += 34;
      }
    }

    const pageCountP = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCountP; i++) {
      doc.setPage(i);
      doc.setFontSize(7.5);
      doc.setTextColor(140);
      doc.text(`${COMPANY_ADDRESS_1}  ·  ${COMPANY_ADDRESS_2}`, pageWidth / 2, 290, { align: "center" });
      doc.text(`Página ${i} de ${pageCountP}`, pageWidth - 14, 290, { align: "right" });
    }
    return doc;
  }

    const customTotal = customItems.reduce((s, it) => s + (Number(it.value) || 0), 0);

  function handleImportCSV(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      const text = String(reader.result).replace(/^\uFEFF/, "");
      const rows = parseCSV(text);
      if (rows.length < 2) { showToast("CSV vazio ou inválido."); return; }
      const header = rows[0].map((h) => h.trim().toLowerCase());
      const idx = (name) => header.indexOf(name);
      const iName = idx("nome"), iPhone = idx("whatsapp"), iEmail = idx("email"), iValue = idx("valor"), iCons = idx("valor_consultas"), iDue = idx("dia_vencimento"), iPlan = idx("plano"), iNotes = idx("observacoes");
      const iCnpj = idx("cnpj"), iCep = idx("cep"), iStreet = idx("rua"), iNumber = idx("numero"), iComp = idx("complemento"), iNeigh = idx("bairro"), iCity = idx("cidade"), iState = idx("estado");
      const iBank = idx("codigo_banco"), iInteg = idx("integracao"), iAnnual = idx("mensalidade_anual"), iCloud = idx("cliente_cloud"), iMarket = idx("marketplace");
      if (iName === -1) { showToast('CSV precisa ter a coluna "Nome".'); return; }
      const imported = rows.slice(1).filter((r) => r[iName] && r[iName].trim()).map((r) => ({
        id: uid(), name: (r[iName] || "").trim(), phone: (r[iPhone] || "").trim(), email: (r[iEmail] || "").trim(),
        value: Number(r[iValue]) || 0, consultations_value: Number(r[iCons]) || 0, due_day: Number(r[iDue]) || null,
        plan: (r[iPlan] || "").trim(), notes: (r[iNotes] || "").trim(),
        cnpj: (r[iCnpj] || "").trim(), cep: (r[iCep] || "").trim(), street: (r[iStreet] || "").trim(), number: (r[iNumber] || "").trim(),
        complement: (r[iComp] || "").trim(), neighborhood: (r[iNeigh] || "").trim(), city: (r[iCity] || "").trim(), state: (r[iState] || "").trim(),
        bank_number: (r[iBank] || "").trim(), integration: (r[iInteg] || "").trim(),
        annual: /sim|true|1/i.test(r[iAnnual] || ""), cloud: /sim|true|1/i.test(r[iCloud] || ""), marketplace: (r[iMarket] || "").trim(),
      }));
      await supa.from("clients").upsert(imported);
      await loadClients();
      showToast(`${imported.length} cliente(s) importado(s).`);
    };
    reader.readAsText(file, "UTF-8");
  }

              <div className="rounded-2xl border p-4" style={{ borderColor: COLORS.cardBorder, background: COLORS.card }}>
                <div className="flex items-center gap-2 mb-1">
                  <button onClick={() => setReportYear((y) => y - 1)} className="p-1 rounded-lg border" style={{ borderColor: COLORS.cardBorder, color: COLORS.ink }}>‹</button>
                  <span className="text-sm font-bold" style={{ color: COLORS.ink }}>Visão anual — {reportYear}</span>
                  <button onClick={() => setReportYear((y) => y + 1)} className="p-1 rounded-lg border" style={{ borderColor: COLORS.cardBorder, color: COLORS.ink }}>›</button>
                  <span className="ml-auto text-sm font-bold" style={{ color: COLORS.success }}>Total recebido: {fmtMoney(yearTotal)}</span>
                </div>
                <BarHistory id="chart-year" history={yearHistory} />
              </div>

              <div className="flex justify-end">
                <button onClick={exportPDF} className="px-4 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: COLORS.brand }}>⬇️ Exportar relatório do mês em PDF</button>
              </div>
            </div>
          )}

          {effectiveTab === "atividades" && (
            <div>
              <div className="rounded-2xl border overflow-hidden" style={{ borderColor: COLORS.cardBorder, background: COLORS.card }}>
                {activityLog.length === 0 ? (
                  <div className="p-10 text-center"><div className="text-3xl mb-2">🕓</div><div className="text-sm" style={{ color: COLORS.inkMuted }}>Nenhuma atividade registrada ainda.</div></div>
                ) : (
                  <div>
                    {activityLog.map((a, i) => (
                      <div key={a.id} className="flex items-center justify-between px-4 py-3" style={{ borderTop: i > 0 ? `1px solid ${COLORS.cardBorder}` : "none" }}>
                        <div>
                          <div className="text-sm" style={{ color: COLORS.ink }}>{a.action}</div>
                          <div className="text-[11px]" style={{ color: COLORS.inkFaint }}>{a.user_email}</div>
                        </div>
                        <div className="text-xs shrink-0 ml-3" style={{ color: COLORS.inkMuted }}>{new Date(a.created_at).toLocaleString("pt-BR")}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <p className="text-[11px] mt-2" style={{ color: COLORS.inkFaint }}>Mostrando as últimas 200 atividades registradas no sistema.</p>
            </div>
          )}

          {effectiveTab === "config" && (
            <div className="space-y-4">
              <div className="rounded-2xl border p-4 space-y-4" style={{ borderColor: COLORS.cardBorder, background: COLORS.card }}>
                <div className="text-xs font-bold uppercase tracking-wide" style={{ color: COLORS.brandLight }}>Chaves PIX por módulo</div>
                <p className="text-[11px]" style={{ color: COLORS.inkMuted }}>Cada módulo usa sua própria chave PIX padrão pra gerar o QR Code de cobrança. Numa proposta, romaneio ou implantação específica, você ainda pode colocar uma chave diferente naquele cadastro — ela sempre tem prioridade sobre a padrão daqui.</p>

                <div className="pt-2 border-t" style={{ borderColor: COLORS.cardBorder }}>
                  <div className="text-xs font-bold mb-2" style={{ color: COLORS.ink }}>📄 Mensalidades</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label className="block">
                      <span className="block text-xs font-semibold mb-1" style={{ color: COLORS.inkMuted }}>Chave PIX</span>
                      <input value={settings.mensalidade_pix_key || ""} onChange={(e) => saveSettings({ ...settings, mensalidade_pix_key: e.target.value })} placeholder="CNPJ, e-mail ou telefone" className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: COLORS.cardBorder, background: "#0E1729", color: COLORS.ink }} />
                    </label>
                    <label className="block">
                      <span className="block text-xs font-semibold mb-1" style={{ color: COLORS.inkMuted }}>Favorecido</span>
                      <input value={settings.mensalidade_pix_favorecido || ""} onChange={(e) => saveSettings({ ...settings, mensalidade_pix_favorecido: e.target.value })} placeholder="Nome de quem recebe" className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: COLORS.cardBorder, background: "#0E1729", color: COLORS.ink }} />
                    </label>
                  </div>
                </div>

                <div className="pt-2 border-t" style={{ borderColor: COLORS.cardBorder }}>
                  <div className="text-xs font-bold mb-2" style={{ color: COLORS.ink }}>🏗️ Implantações</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label className="block">
                      <span className="block text-xs font-semibold mb-1" style={{ color: COLORS.inkMuted }}>Chave PIX</span>
                      <input value={settings.implantacao_pix_key || ""} onChange={(e) => saveSettings({ ...settings, implantacao_pix_key: e.target.value })} placeholder="CNPJ, e-mail ou telefone" className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: COLORS.cardBorder, background: "#0E1729", color: COLORS.ink }} />
                    </label>
                    <label className="block">
                      <span className="block text-xs font-semibold mb-1" style={{ color: COLORS.inkMuted }}>Favorecido</span>
                      <input value={settings.implantacao_pix_favorecido || ""} onChange={(e) => saveSettings({ ...settings, implantacao_pix_favorecido: e.target.value })} placeholder="Nome de quem recebe" className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: COLORS.cardBorder, background: "#0E1729", color: COLORS.ink }} />
                    </label>
                  </div>
                </div>

                <div className="pt-2 border-t" style={{ borderColor: COLORS.cardBorder }}>
                  <div className="text-xs font-bold mb-2" style={{ color: COLORS.ink }}>📦 Romaneio Etiqueta</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label className="block">
                      <span className="block text-xs font-semibold mb-1" style={{ color: COLORS.inkMuted }}>Chave PIX</span>
                      <input value={settings.romaneio_pix_key || ""} onChange={(e) => saveSettings({ ...settings, romaneio_pix_key: e.target.value })} placeholder="CNPJ, e-mail ou telefone" className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: COLORS.cardBorder, background: "#0E1729", color: COLORS.ink }} />
                    </label>
                    <label className="block">
                      <span className="block text-xs font-semibold mb-1" style={{ color: COLORS.inkMuted }}>Favorecido</span>
                      <input value={settings.romaneio_pix_favorecido || ""} onChange={(e) => saveSettings({ ...settings, romaneio_pix_favorecido: e.target.value })} placeholder="Nome de quem recebe" className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: COLORS.cardBorder, background: "#0E1729", color: COLORS.ink }} />
                    </label>
                  </div>
                </div>

                <div className="pt-2 border-t" style={{ borderColor: COLORS.cardBorder }}>
                  <label className="block max-w-xs">
                    <span className="block text-xs font-semibold mb-1" style={{ color: COLORS.inkMuted }}>Cidade (usada em todos os QR Codes)</span>
                    <input value={settings.company_pix_city || ""} onChange={(e) => saveSettings({ ...settings, company_pix_city: e.target.value })} placeholder="Ex: SAO PAULO" className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: COLORS.cardBorder, background: "#0E1729", color: COLORS.ink }} />
                  </label>
                </div>
              </div>

              <div className="rounded-2xl border p-4 space-y-4" style={{ borderColor: COLORS.cardBorder, background: COLORS.card }}>
                <p className="text-xs" style={{ color: COLORS.inkMuted }}>Use {"{nome}"}, {"{valor}"}, {"{vencimento}"}, {"{plano}"}, {"{link}"}, {"{mesnome}"}.</p>
                <label className="block">
                  <span className="block text-xs font-semibold mb-1" style={{ color: COLORS.inkMuted }}>Mensagem do WhatsApp</span>
                  <textarea value={settings.wa_template} onChange={(e) => saveSettings({ ...settings, wa_template: e.target.value })} rows={3} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: COLORS.cardBorder, background: "#0E1729", color: COLORS.ink }} />
                </label>
                <label className="block">
                  <span className="block text-xs font-semibold mb-1" style={{ color: COLORS.inkMuted }}>Assunto do e-mail</span>
                  <input value={settings.email_subject} onChange={(e) => saveSettings({ ...settings, email_subject: e.target.value })} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: COLORS.cardBorder, background: "#0E1729", color: COLORS.ink }} />
                </label>
                <label className="block">
                  <span className="block text-xs font-semibold mb-1" style={{ color: COLORS.inkMuted }}>Corpo do e-mail</span>
                  <textarea value={settings.email_body} onChange={(e) => saveSettings({ ...settings, email_body: e.target.value })} rows={5} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: COLORS.cardBorder, background: "#0E1729", color: COLORS.ink }} />
                </label>
              </div>
            </div>
          )}

        </div>
      </main>

      {toast && <div className="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-sm font-semibold text-white shadow-lg" style={{ background: COLORS.card, border: `1px solid ${COLORS.cardBorder}` }}>{toast}</div>}
      {pixModal && <PixQRModal {...pixModal} onClose={() => setPixModal(null)} />}
      {viewingTech && <TechImplementationViewer t={viewingTech} onClose={() => setViewingTech(null)} />}
      {showChangePassword && <ChangePasswordModal onClose={() => setShowChangePassword(false)} showToast={showToast} />}
      {historyClient && <ClientHistoryModal client={historyClient} onClose={() => setHistoryClient(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
